# ──────────────────────────────────────────────────────────────
#  Nginx de borda — Ateliê Nós de Afeto
#
#  Único ponto de entrada da aplicação. Responsabilidades:
#    1. Redirecionar todo HTTP (80) para HTTPS (443)
#    2. Terminar TLS com certificado local (mkcert)
#    3. Aplicar cabeçalhos de segurança HTTP
#    4. Atuar como proxy reverso:
#         /api/      → backend  (Express)
#         /uploads/  → backend  (imagens estáticas)
#         /          → frontend (SPA React)
# ──────────────────────────────────────────────────────────────

# ─── 1. HTTP → HTTPS (redirecionamento permanente) ───────────
server {
    listen 80;
    listen [::]:80;
    server_name meuapp.local;

    # Qualquer requisição em texto puro é redirecionada para HTTPS.
    return 301 https://$host$request_uri;
}

# ─── 2. Servidor HTTPS principal ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meuapp.local;

    # ─── TLS (certificado local gerado via mkcert) ───────────
    ssl_certificate     /etc/nginx/certs/meuapp.local.pem;
    ssl_certificate_key /etc/nginx/certs/meuapp.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── 3. Cabeçalhos de segurança HTTP ─────────────────────
    # Impede que a página seja embutida em iframes (anti-clickjacking).
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Impede o navegador de "adivinhar" o MIME type (anti MIME-sniffing).
    add_header X-Content-Type-Options "nosniff" always;
    # Controla quanta informação de referrer é enviada.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restringe APIs sensíveis do navegador.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Força HTTPS em acessos futuros (HSTS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Política de conteúdo: mitiga XSS limitando origens de scripts/estilos.
    # 'unsafe-inline' em style-src é necessário p/ CRA + Bootstrap inline.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Tamanho máximo de upload (imagens de produtos)
    client_max_body_size 10M;

    # ─── 4a. API → backend ───────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 4b. Imagens enviadas → backend ──────────────────────
    location /uploads/ {
        proxy_pass http://backend:3333;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 4c. Healthcheck do backend (opcional) ───────────────
    location /health {
        proxy_pass http://backend:3333/health;
        proxy_set_header Host $host;
    }

    # ─── 4d. Tudo o mais → frontend (SPA) ────────────────────
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
